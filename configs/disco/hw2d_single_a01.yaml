# Single-α baseline: train ONLY on α=0.1.
#
# Control for the multi-α story. If multi-α joint training (hw2d_multi*)
# does not beat the *best* single-α model on its own α, the "joint
# training helps" claim is unsupported.
#
# Validation runs on all 3 training αs so we can also see how badly
# this model generalizes off-distribution.

run_name: "disco_hw2d_single_a01"
seed: 0

# --- data ---------------------------------------------------------------
data_root: "/work2/10407/anthony50102/frontera/data/IEEE/hw2d"
dataset_name: "hw2d"
train_alphas: [0.1]
val_alphas:   [0.1, 1.0, 5.0]   # eval on all 3 to measure off-α generalization
resolution: [256, 256]
n_past: 16
n_future: 1
burn_in_frac: 0.5
g1_tail_frac: 0.1
num_workers: 4

# --- model (same as hw2d_multi_tuned) -----------------------------------
hidden_dim: 384
patch_size: 16
processor_blocks: 12
num_heads: 6
groups: 1
bias_type: "space-time"
drop_path: 0.1
max_steps: 32
rtol: 5.0e-6
atol: 1.0e-9
integration_library: "torchdiffeq"
hpnn_head_hidden_dim: 384

# --- optimization -------------------------------------------------------
batch_size: 8
accum_grad: 1
max_epochs: 2000
epoch_size: 200
optimizer: "adamw"
learning_rate: 5.0e-5
weight_decay: 1.0e-3
scheduler: "cosine"
warmup_epochs: 10
gnorm: 1.0
amp: false

# --- validation ---------------------------------------------------------
val_batches: 16
val_rollout_steps: [1]

# --- logging / checkpoints ---------------------------------------------
checkpoint_save_interval: 50
log_interval: 20
wandb_enabled: false
wandb_project: "ieee-disco"
wandb_entity: ""
