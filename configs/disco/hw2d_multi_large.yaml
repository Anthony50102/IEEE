# Model-size sweep: LARGER variant of hw2d_multi_tuned.yaml.
#
# Same data, same optimization, just a larger backbone:
#   - hidden_dim 384 → 576       (1.5× width)
#   - processor_blocks 12 (kept)
#   - hpnn_head_hidden_dim 384 → 576
# heads kept at 6 (576/6 = 96 dims per head).
#
# Memory check: 576² × 12 blocks × small constant ≈ ~225M params,
# fp32 ≈ 900 MB — still tiny against 96 GB HBM3. batch 8 at 256² × 16
# frames should fit. If OOM, drop to batch 4 + accum 2.

run_name: "disco_hw2d_multi_large"
seed: 0

data_root: "/work2/10407/anthony50102/frontera/data/IEEE/hw2d"
dataset_name: "hw2d"
train_alphas: [0.1, 1.0, 5.0]
val_alphas:   [0.1, 1.0, 5.0]
resolution: [256, 256]
n_past: 16
n_future: 1
burn_in_frac: 0.5
g1_tail_frac: 0.1
num_workers: 4

# --- model (LARGE) -----------------------------------------------------
hidden_dim: 576
patch_size: 16
processor_blocks: 12
num_heads: 6
groups: 1
bias_type: "space-time"
drop_path: 0.1
max_steps: 32
rtol: 5.0e-6
atol: 1.0e-9
integration_library: "torchdiffeq"
hpnn_head_hidden_dim: 576

# --- optimization (unchanged) ------------------------------------------
batch_size: 8
accum_grad: 1
max_epochs: 2000
epoch_size: 200
optimizer: "adamw"
learning_rate: 5.0e-5
weight_decay: 1.0e-3
scheduler: "cosine"
warmup_epochs: 10
gnorm: 1.0
amp: false

val_batches: 16
val_rollout_steps: [1]

checkpoint_save_interval: 50
log_interval: 20
wandb_enabled: false
wandb_project: "ieee-disco"
wandb_entity: ""
