# Multi-α DISCO training on HW2D — second seed of hw2d_multi.yaml.
#
# Post-refactor (unified-dataset, 2026-05-17) hw2d_multi.yaml already
# uses the batch-8 × accum-1 layout that was the original justification
# for this "tuned" file. We keep it as a *different seed* of the same
# recipe so the multi-α condition has n=2 runs for variance reporting.
#
# To extend to n≥3, copy this file and bump `seed`.

run_name: "disco_hw2d_multi_seed1"
seed: 1

# --- data ---------------------------------------------------------------
data_root: "/work2/10407/anthony50102/frontera/data/IEEE/hw2d"
dataset_name: "hw2d"
train_alphas: [0.1, 1.0, 5.0]
val_alphas:   [0.1, 1.0, 5.0]
resolution: [256, 256]
n_past: 16
n_future: 1
burn_in_frac: 0.5
g1_tail_frac: 0.1
num_workers: 4

# --- model --------------------------------------------------------------
hidden_dim: 384
patch_size: 16
processor_blocks: 12
num_heads: 6
groups: 1
bias_type: "space-time"
drop_path: 0.1
max_steps: 32
rtol: 5.0e-6
atol: 1.0e-9
integration_library: "torchdiffeq"
hpnn_head_hidden_dim: 384

# --- optimization -------------------------------------------------------
batch_size: 8
accum_grad: 1
max_epochs: 2000
epoch_size: 200
optimizer: "adamw"
learning_rate: 5.0e-5
weight_decay: 1.0e-3
scheduler: "cosine"
warmup_epochs: 10
gnorm: 1.0
amp: false

# --- validation ---------------------------------------------------------
val_batches: 16
val_rollout_steps: [1]

# --- logging / checkpoints ---------------------------------------------
checkpoint_save_interval: 50
log_interval: 20
wandb_enabled: false
wandb_project: "ieee-disco"
wandb_entity: ""
