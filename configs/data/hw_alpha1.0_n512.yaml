# HW DNS config: alpha = 1.0 (canonical reference point).
# Reference Gamma_n = 0.60 +/- 0.05 (hw2d README, 512^2).
# Tightest reference: 25-run mean 0.60 +/- 0.01.
# Stored at full 512^2 resolution; downstream training may stride to 256^2.
#
# end_time bumped from 500 -> 1500 to give OpInf (Phase 2) ~5500 post-burn-in
# snapshots, enough to fit r=50 with a comfortable rows/cols ratio.

alpha: 1.0
kappa: 1.0
k0: 0.15
N: 3
nu: 5.0e-9

grid_pts: 512
downsample_factor: 1
step_size: 0.025
end_time: 1500.0
snaps: 10                    # dt_save = 0.25  -> ~6000 frames

init_type: normal
init_scale: 0.01
seed: 0

recording_start_time: 0.0
buffer_length: 100
chunk_size: 100

label: hw_alpha1.0_n512
