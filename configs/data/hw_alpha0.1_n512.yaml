# HW DNS config: alpha = 0.1 (hydrodynamic / weakly adiabatic).
# Reference Gamma_n = 1.51 +/- 0.21 (hw2d README, 512^2).
# Stored at full 512^2 resolution; downstream training may stride to 256^2.
#
# end_time bumped from 400 -> 1500 to give OpInf (Phase 2) ~5500 post-burn-in
# snapshots, enough to fit r=50 with a comfortable rows/cols ratio.

alpha: 0.1
kappa: 1.0
k0: 0.15
N: 3
nu: 5.0e-9

grid_pts: 512
downsample_factor: 1
step_size: 0.01
end_time: 1500.0
snaps: 25                    # dt_save = 0.25  -> ~6000 frames

init_type: normal
init_scale: 0.01
seed: 0

recording_start_time: 0.0
buffer_length: 100
chunk_size: 100

label: hw_alpha0.1_n512
